services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file: .env.docker
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
    restart: unless-stopped

  queue:
    build: .
    command: php artisan queue:work --tries=3 --timeout=90
    env_file: .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file: .env.docker
    environment:
      MYSQL_DATABASE: house_checker
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql:
  storage:
